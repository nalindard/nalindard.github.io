<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nalinda — Redirecting</title>

    <link rel="canonical" href="https://nalinda.dev/" />
    <meta name="robots" content="noindex, follow" />
    <meta http-equiv="refresh" content="0; url=https://nalinda.dev/" />

    <script>
      window.location.replace(
        "https://nalinda.dev/" + window.location.search + window.location.hash
      );
    </script>
  </head>

  <body>
    <p>
      Redirecting to
      <a href="https://nalinda.dev/">nalinda.dev</a>
    </p>
  </body>
</html>
