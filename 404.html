<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nalinda — Redirecting</title>

    <link rel="canonical" href="https://nalinda.dev/" />
    <meta name="robots" content="noindex, follow" />
    <meta http-equiv="refresh" content="0; url=https://nalinda.dev/" />

    <script>
      const target =
        "https://nalinda.dev" +
        window.location.pathname +
        window.location.search +
        window.location.hash;

      window.location.replace(target);
    </script>
  </head>

  <body>
    <p>
      Redirecting to
      <a href="https://nalinda.dev/">nalinda.dev</a>
    </p>
  </body>
</html>
